version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: quiz-jenkins
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - D:/KP_PSKP-master:/var/jenkins_home/workspace/QuizMaster-CI-CD
    restart: unless-stopped

volumes:
  jenkins_home: